<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>نظام السحب — إنڤير</title>
<script>
  // نظام السحب انتقل إلى INVARE Ops (2026-11-03): الباركودات والروابط القديمة
  // تفتح الصفحة نفسها في النظام الجديد بنفس المعرّف.
  (function () {
    var NEW = "https://invare-ops.116-203-115-217.nip.io";
    var path = location.pathname.replace(/^\/uco-pickup/, "");
    var q = new URLSearchParams(location.search);
    var enc = encodeURIComponent;
    var to = NEW + "/pickup";
    if (/^\/scan/.test(path) && q.get("g")) to = NEW + "/p/scan/" + enc(q.get("g"));
    else if (/^\/contract/.test(path) && q.get("g")) to = NEW + "/p/contract/" + enc(q.get("g"));
    else if (/^\/invoice/.test(path) && q.get("r")) to = NEW + "/p/note/" + enc(q.get("r")) + (q.get("copy") === "1" ? "?copy=1" : "");
    else if (/^\/admin/.test(path)) to = NEW + "/oil/collectors";
    location.replace(to);
    document.addEventListener("DOMContentLoaded", function () { document.getElementById("go").href = to; });
  })();
</script>
<style>body{font-family:system-ui,sans-serif;background:#f6f5f2;color:#222;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:16px;text-align:center}a{color:#6b7d2a;font-weight:700}</style>
</head>
<body>
<p>نظام السحب انتقل إلى موقع إنڤير الجديد…<br><a id="go" href="https://invare-ops.116-203-115-217.nip.io/pickup">اضغط هنا إن لم تنتقل تلقائياً</a></p>
</body>
</html>
